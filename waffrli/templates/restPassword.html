{% comment %} {% extends "base.html" %} {% endcomment %}
{% load static %}
{% block content %}
<link href="{% static 'css/Register_Style.css' %}" rel="stylesheet" />

<div class="resetContainer">
    <div class="form-header">
        <h3>Forgot Password</h3>
        <p>Enter your email to reset your password</p>
    </div>

    <form id="forgotPasswordForm">
        <div class="form-group">
            <input type="email" id="resetEmail" required>
            <label for="resetEmail">Email Address</label>
            <span class="error-message" id="resetEmailError"></span>
        </div>

        <button type="submit" class="submit-btn">Send Reset Link</button>

        <p class="login-link">
            Remember your password? <a href="{% url 'login' %}">Sign in</a>
        </p>
    </form>

    <!-- Notification -->
    <div id="notification" class="notification hidden">
        <span id="notificationMessage"></span>
    </div>
</div>

<!-- Firebase Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyB5wG6k6xmmMHYSJB4YlkXxFc5LNZC599U",
        authDomain: "test-ad2a0.firebaseapp.com",
        projectId: "test-ad2a0",
        storageBucket: "test-ad2a0.appspot.com",
        messagingSenderId: "795757100222",
        appId: "1:795757100222:web:1f9259883b65b5eaaa32ef"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Handle Password Reset
    document.getElementById("forgotPasswordForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("resetEmail").value.trim();

        if (!email) {
            showNotification("Please enter a valid email!", "error");
            return;
        }

        try {
            await sendPasswordResetEmail(auth, email);
            showNotification("Password reset email sent! Check your inbox.", "success");
        } catch (error) {
            console.error("Error:", error.message);
            showNotification(error.message, "error");
        }
    });

    // Function to Show Notifications
    function showNotification(message, type = "success") {
        const container = document.getElementById("notification");
        const messageSpan = document.getElementById("notificationMessage");

        messageSpan.textContent = message;
        container.classList.remove("hidden", "error", "success");

        if (type === "error") {
            container.classList.add("error");
        } else {
            container.classList.add("success");
        }

        setTimeout(() => {
            container.classList.add("hidden");
        }, 4000);
    }
</script>

{% endblock %}
