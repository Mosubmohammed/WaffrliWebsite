{% extends "base.html" %}
{% load static %}
{% block content %}
<link href="{% static 'css/settings44.css' %}" rel="stylesheet" />

<nav class="user-navbar">
    <ul>
        <li>
            <a href="{% url 'user_profile' user.id %}" class="user-nav-link">
                <span class="user-nav-icon">🏠</span>
                My Profile
            </a>
        </li>
        <li>
            <a href="{% url 'inbox' %}" class="user-nav-link">
                <span class="user-nav-icon">📥</span>
                Inbox
            </a>
        </li>
        <li>
            <a href="{% url 'saved_items' %}" class="user-nav-link">
                <span class="user-nav-icon">🔖</span>
                Saved Items
            </a>
        </li>
        <li>
            <a href="{% url 'settings' %}" class="user-nav-link active">
                <span class="user-nav-icon">⚙️</span>
                Settings
            </a>
        </li>
    </ul>
</nav>
    
    <div class="SettingContainer">
        <div class="SettingSidebar">
            <ul class="nav-menu">
                <li><a href="{% url 'settings' %}">Account Basics</a></li>
                <li class="active"><a href="{% url 'update_info' %}">Profile</a></li>
            </ul>
        </div>
        

        
        <form method="POST" enctype="multipart/form-data" class="profile-settings">
            {% csrf_token %}
            
            <h1>Profile</h1>
            
            <div class="setting-section avatar-section">
                <div class="avatar-container">
                    {% if user.customer.image %}
                        <img src="{{ user.customer.image.url }}" alt="Current Avatar" class="current-avatar">
                    {% else %}
                        <img src="{% static 'images/default-profile.png' %}" alt="Default Avatar" class="current-avatar">
                    {% endif %}
                    <input type="file" id="avatar-upload" name="image" accept="image/*" style="display: none;">
                    <button type="button" class="change-avatar-btn" onclick="document.getElementById('avatar-upload').click()">Edit</button>
                </div>
            </div>
            
            <div class="setting-section">
                <h3>Personal Information</h3>
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}">
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" value="{{ user.customer.phone|default:'' }}">
                </div>
            </div>
            
            <div class="setting-section">
                <h3>Location</h3>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="Search for your address..." 
                           value="{{ user.customer.formatted_address|default:'' }}">
                </div>

                
                <input type="hidden" name="latitude" id="latitude" value="{{ user.customer.latitude|default:'' }}">
                <input type="hidden" name="longitude" id="longitude" value="{{ user.customer.longitude|default:'' }}">
                <input type="hidden" name="formatted_address" id="formatted_address" value="{{ user.customer.formatted_address|default:'' }}">

                
                <div class="form-group">
                    <div id="map-container">
                        <div id="map" style="height: 300px; width: 100%; border-radius: 8px"></div>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="save-settings-btn">Save Settings</button>
        </form>
    </div>
    

    <script>
        // Add this function to check if location is in Jordan
        function isLocationInJordan(addressComponents) {
            if (!addressComponents || !Array.isArray(addressComponents)) {
                return false;
            }
            
            const countryComponent = addressComponents.find(
                component => component.types.includes("country")
            );
            
            if (!countryComponent) {
                return false;
            }
            
            return countryComponent.short_name === "JO" || 
                   countryComponent.long_name.toLowerCase().includes("jordan");
        }
        

        function initMap() {
            
            const savedLat = parseFloat(document.getElementById("latitude").value) || 31.9539;
            const savedLng = parseFloat(document.getElementById("longitude").value) || 35.9106;
            const defaultLocation = { lat: savedLat, lng: savedLng };
        
            // Initialize map
            map = new google.maps.Map(document.getElementById("map"), {
                center: defaultLocation,
                zoom: 13,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false,
            });
        
            // Initialize geocoder for address lookup
            geocoder = new google.maps.Geocoder();
        
            // Create marker - using AdvancedMarkerElement to avoid deprecation warning
            try {
                
                marker = new google.maps.marker.AdvancedMarkerElement({
                    position: defaultLocation,
                    map: map,
                    draggable: true,
                });
            
                map.addListener("click", (event) => {
                    marker.position = event.latLng;
                    updateLocationFields(event.latLng);
                });
            
                
                marker.addListener("dragend", () => {
                    updateLocationFields(marker.position);
                    map.panTo(marker.position);
                });
            } catch (e) {
                // Fall back to the old Marker if AdvancedMarkerElement is not available
                marker = new google.maps.Marker({
                    position: defaultLocation,
                    map: map,
                    draggable: true,
                    animation: google.maps.Animation.DROP,
                });
            
               
                marker.addListener("dragend", () => {
                    const position = marker.getPosition();
                    updateLocationFields(position);
                    map.panTo(position);
                });
            
                
                map.addListener("click", (event) => {
                    marker.setPosition(event.latLng);
                    updateLocationFields(event.latLng);
                });
            }
        
            const addressInput = document.getElementById("address");
            autocomplete = new google.maps.places.Autocomplete(addressInput);
            autocomplete.setFields(["geometry", "formatted_address", "address_components"]);
        
            autocomplete.addListener("place_changed", () => {
                const place = autocomplete.getPlace();
            
                if (!place.geometry) {
                    console.error("No geometry found for this place");
                    return;
                }
                
                
                if (!isLocationInJordan(place.address_components)) {
                    alert("Sorry, our service is only available in Jordan at this time.");
                   
                    document.getElementById("address").value = "";
                    document.getElementById("formatted_address").value = "";
                    return;
                }
            
                
                map.setCenter(place.geometry.location);
            
                
                if (marker.setPosition) {
                    marker.setPosition(place.geometry.location);
                } else {
                    marker.position = place.geometry.location;
                }
            
                map.setZoom(15);
            
                
                updateLocationFields(place.geometry.location);
                document.getElementById("formatted_address").value = place.formatted_address;
            });
        }
        
        function updateLocationFields(location) {
            
            document.getElementById("latitude").value = location.lat();
            document.getElementById("longitude").value = location.lng();
        

            geocoder.geocode(
                { location: { lat: location.lat(), lng: location.lng() } },
                (results, status) => {
                    if (status === "OK" && results[0]) {
                        if (!isLocationInJordan(results[0].address_components)) {
                            alert("Sorry, our service is only available in Jordan at this time.");

                            document.getElementById("address").value = "";
                            document.getElementById("formatted_address").value = "";
                            return;
                        }
                        
                        const address = results[0].formatted_address;
                        document.getElementById("formatted_address").value = address;
                        
                        // Don't update the address input if the user is currently typing
                        const addressInput = document.getElementById("address");
                        if (!addressInput.matches(":focus")) {
                            addressInput.value = address;
                        }
                    }
                }
            );
        }
        
        let map;
        let marker;
        let geocoder;
        let autocomplete;
        
        // Handle profile image preview
        document.getElementById('avatar-upload').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.querySelector('.current-avatar').src = e.target.result;
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });
    </script>
    

    <script>
        (function loadGoogleMapsScript() {
            const script = document.createElement("script");
            script.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyDtfNpTlfiR1P3oEqtVWhtVWN8RSeu4xaY&libraries=places&callback=initMap";
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        })();
    </script>
{% endblock %}
