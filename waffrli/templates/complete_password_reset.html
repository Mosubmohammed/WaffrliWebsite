{% extends "base.html" %}
{% load static %}

{% block content %}
<link href="{% static 'css/Register_Stylee606.css' %}" rel="stylesheet" />

<div class="New-resetContainer">
    <div class="form-header">
        <h3>Complete Password Reset</h3>
        <p>Please enter your email and new password</p>
    </div>

    <form method="post" action="{% url 'complete_password_reset' %}">
        {% csrf_token %}
        <div class="form-group">
            <input type="email" id="email" name="email" required>
            <label for="email">Email Address</label>
        </div>
        
        <div class="form-group">
            <input type="password" id="new_password" name="new_password" required>
            <label for="new_password">New Password</label>
        </div>
        
        <div class="form-group">
            <input type="password" id="confirm_password" name="confirm_password" required>
            <label for="confirm_password">Confirm New Password</label>
        </div>
        
        <button type="submit" class="submit-btn">Reset Password</button>
        
        <p class="login-link">
            <a href="{% url 'forgot_password' %}">Try again</a>
        </p>
    </form>
</div>
{% endblock %}
