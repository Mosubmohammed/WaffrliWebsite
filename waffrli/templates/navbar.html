{% load static %}
<header>
    <div class="top-bar">
      <div class="contact-info">
        <a href="{% url 'home' %}">
          <div class="logo">
            <img src="{% static 'img\logo.png' %}" alt="Waffrli Logo" style="max-width: 120px; height: auto;">
          </div>
        </a>
      </div>
  
      <div class="account-section">
        <span><i class="fas fa-map-marker-alt"></i>JORDAN</span>
        <span><i class="fas fa-dollar-sign"></i>JD</span>
        <div class="dropdown">
          <button class="icon-button" title="Account">
            <i class="fa-solid fa-user-gear"></i>
            <span>Account</span>
          </button>
          <div class="dropdown-content">
            {% if request.user.is_authenticated %}
              <a href="{% url 'user_profile' request.user.id %}"><i class="fas fa-user"></i> My Profile</a>
              <a href="{% url 'settings' %}"><i class="fas fa-cog"></i> Settings</a>
              <a href="{% url 'inbox' %}"><i class="fa-solid fa-inbox"></i> Inbox</a>
              <a href="{% url 'logout' %}" style="color:red"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a>
              <a class="nav-link" href="{% url 'archived_deals' %}"><i class="fas fa-archive"></i> Archived Deals</a>
                    

                

            {% else %}
              <a href="{% url 'login' %}"><i class="fas fa-sign-in-alt"></i> Sign In</a>
              <a href="{% url 'register' %}"><i class="fas fa-user-plus"></i> Register</a>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  
    <!-- Search Bar -->
    <div class="search-section">
      <div class="search-container">
        <form method="POST" action="{% url 'search' %}">
          {% csrf_token %}
          <div class="dropdown">
            <div class="dropdown-select">Categories</div>
            <div class="dropdown-content">
              
              {% for category in categories %}
                <a href="{% url 'category' category.name|slugify %}">{{ category.name }}</a>
              {% endfor %}
            </div>
          </div>
          <input type="text" name="searched" placeholder="Search here" class="search-input">
          <button type="submit" class="search-submit-btn">Search</button>
        </form>
      </div>
      <div class="user-actions">
        <a href="{% url 'notifications' %}">
          <button class="icon-button" title="Alerts">
            <i class="fa-solid fa-bell"></i>
            <span class="cart-badge" style="display: none;">0</span>
            <span>Alert</span>
          </button>
        </a>
  
        <a href="{% url 'post_deal' %}">
          <div class="nav-actions">
            <button class="icon-button" title="Post Deal">
              <i class="fa-solid fa-circle-plus"></i>
              <span>Post deal</span>
            </button>
          </div>
        </a>
  
        <a href="{% url 'saved_items' %}">
          <button class="icon-button" title="Saved Items">
            <i class="fa-regular fa-bookmark"></i>
            <span>Saved</span>
          </button>
        </a>
  
        <a href="{% url 'wishlist' %}">
          <button class="icon-button" title="Wishlist">
            <i class="fa-solid fa-clipboard-list"></i>
            <span>Wishlist</span>
          </button>
        </a>
      </div>
    </div>
  
    <!-- Red Line -->
    <div class="red-line"></div>
  
    <div class="Main-container nav-container">
      <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
       <a href="{% url 'hot_deals' %}">Hot Deals</a>
        <a href="{% url 'popular' %}">Popular Deals</a>
        
          <a href="{% url 'AllCategory' %}">Categories</a>
        
        <br> <br>
      </div>
    </div>
  </header>
  
  <script>

        // Set authentication status
      window.userIsAuthenticated = {% if user.is_authenticated %}true{% else %}false{% endif %};
    
        // Only call updateNotificationCounter if user is logged in
      if (window.userIsAuthenticated) {
            // Call the function initially
            updateNotificationCounter();
            
            // Optionally, set an interval to periodically update
            setInterval(updateNotificationCounter, 60000); // Update every minute
        }
    // Notification handling
    let notificationPollingInterval = null;
    let lastNotificationCount = null;
    const POLLING_INTERVAL = 5 * 60 * 1000; // 5 minutes
    
// Update notification counter
function updateNotificationCounter() {
  // Check if user is logged in (we'll add a flag in the template)
  if (window.userIsAuthenticated) {
      fetch('{% url "get_notification_count" %}')
          .then(response => response.json())
          .then(data => {
              const counter = document.querySelector('.cart-badge');
              if (counter) {
                  counter.textContent = data.count;
                  
                  if (data.count > 0) {
                      counter.style.display = 'block';
                  } else {
                      counter.style.display = 'none';
                  }
              }
          })
          .catch(error => console.error('Error fetching notification count:', error));
  } else {
      // Hide the counter for non-logged in users
      const counter = document.querySelector('.cart-badge');
      if (counter) {
          counter.style.display = 'none';
      }
  }
}
    
    function startNotificationPolling() {
      if (notificationPollingInterval) {
        clearInterval(notificationPollingInterval);
      }
      
      updateNotificationCounter();
      notificationPollingInterval = setInterval(updateNotificationCounter, POLLING_INTERVAL);
    }
    
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') {
        if (notificationPollingInterval) {
          clearInterval(notificationPollingInterval);
          notificationPollingInterval = null;
        }
      } else {
        startNotificationPolling();
      }
    });
    
    window.addEventListener('notificationUpdate', function() {
      updateNotificationCounter();
    });
    
    document.addEventListener('DOMContentLoaded', function() {
      startNotificationPolling();
    });
  </script>
