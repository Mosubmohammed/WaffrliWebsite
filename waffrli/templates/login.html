{% extends "base.html" %}
{% load static %}

{% block content %}
<link href="{% static 'css/Register_Stylee99.css' %}" rel="stylesheet" />
    <div class="container">
        <div id="loginForm" class="Login-container">
            <div class="Login-left-side">             
            </div>
            
            <div class="right-side">
                <div class="form-header">
                    <h3>Sign In</h3>
                    <p>Enter your credentials to continue</p>
                </div>

                <form id="login" class="signIn-form" method="post" action="{% url 'login' %}" >
                        {% csrf_token %}
                    
                    <div class="form-group">
                        <input type="email" name="email" id="email" required>
                        <label for="email">Email</label>
                    </div>

                    <div class="form-group">
                        <input type="password" name="password" id="password" required>
                        <label for="password">Password</label>
                    </div>

                    <div class="remember-forgot">
                        <a href="{% url 'forgot_password' %}" class="forgot-link" id="forgotPassword">Forgot Password?</a>
                    </div>

                    <button type="submit" class="submit-btn">Sign In</button>

                    <p class="login-link">
                        Don't have an account? <a href="{% url 'register' %}" id="showSignup">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    
    <div id="notification-container"></div>
{% endblock %}
