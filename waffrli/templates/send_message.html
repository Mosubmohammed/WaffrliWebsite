{% extends 'base.html' %} 
{% block title %}New Message{% endblock %}
{% load static %} 
 {% block content %}
<link href="{% static 'css/sendMessage.css' %}" rel="stylesheet" />

<div class="container">


  <div class="content">
    <div class="content-header">
      <h1>New Message</h1>
    </div>

      <form method="post" action="{% url 'send_message' %}">
        {% csrf_token %}

        <div class="form-group">
          <div class="form-row">
            <label for="recipient">Send To</label>
            <a href="#" class="bcc-link">Bcc</a>
          </div>
          <input
            type="text"
            id="recipient"
            name="recipient"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="subject">Title</label>
          <input type="text" id="subject" name="subject" class="form-control" />
        </div>

        <div class="form-group">
          <div class="editor-toolbar">
            <button type="button" class="toolbar-btn">
              <strong>B</strong>
            </button>
            <button type="button" class="toolbar-btn"><em>I</em></button>
            <button type="button" class="toolbar-btn"><u>U</u></button>
            <button type="button" class="toolbar-btn"><s>S</s></button>
            <button type="button" class="toolbar-btn">T<sub>x</sub></button>
            <span class="toolbar-separator"></span>
            <button type="button" class="toolbar-btn">≡</button>
            <button type="button" class="toolbar-btn">≣</button>
            <button type="button" class="toolbar-btn">☰</button>
            <span class="toolbar-separator"></span>
            <button type="button" class="toolbar-btn">•</button>
            <button type="button" class="toolbar-btn">○</button>
            <span class="toolbar-separator"></span>
            <button type="button" class="toolbar-btn">⇤</button>
            <button type="button" class="toolbar-btn">⇥</button>
            <span class="toolbar-separator"></span>
            <button type="button" class="toolbar-btn">"</button>
            <span class="toolbar-separator"></span>
            <button type="button" class="toolbar-btn">🔗</button>
            <button type="button" class="toolbar-btn">🔄</button>
            <span class="toolbar-separator"></span>
            <button type="button" class="toolbar-btn source-btn">Source</button>
          </div>
          <textarea
            id="message-body"
            name="body"
            class="form-control editor-area"
          ></textarea>
        </div>

        <div class="form-group">
          <div class="options-dropdown">
            <button type="button" class="dropdown-btn">
              Additional Options
              <span class="dropdown-arrow">▼</span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <button type="submit" class="send-btn">Send Message</button>
        </div>
      </form>
    
  </div>
</div>
{% endblock %}
